<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"
        <title>Admin Dashboard - MY Portfolio</title>
        <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}"> 
    </head>
    <body style="background-color: #f4d7d6;">

        <div class=""admin-container">
            <h1 style="text-align: center; margin-bottom: 30px; color: #2c3e50;">Admin Dashboard</h1>
            <p style="text-align: center; margin-bottom: 20px;">All messages received from the portfolio coontact form.</p>

            <table class=""admin-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Message</th>
                    </tr>
                </thead>
                <tbody>
                    {% for msg in messages %}
                    <tr>
                        <td>{{ msg.id }}</td>
                        <td><strong>{{ msg.name}}</strong></td>
                        <td><a href="mailto:{{ msg.email }}">{{ msg.email }}</a></td>
                        <td>{{ msg.message }}</td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="4" style="text-align: center;">No messages yet!</td>
                    </tr>
                    {% endfor %}
                </tbody> 
            </table>
            <div style="text-align: center; margin-top: 30px;">
                <a href="/" class="btn">Back to Portfolio</a>
            </div>
        </div>
        
    </body>
</html>
