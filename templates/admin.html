<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"
        <title>Admin Dashboard - MY Portfolio</title>
        <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}"> 
    </head>
    <body style="background-color: #f4d7d6;">
        <a href="/logout" style="position: absolute; top: 20px; right: 20px; background-color: #dc3545; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px; font-weight: bold; font-family: Arial, Helvetica, sans-serif; box-shadow: 0 4px 6px rgba(0,0,0,0.1);"> Logout </a>

        <div class=""admin-container">
            </div>
            <h1 style="text-align: center; margin-bottom: 30px; color: #2c3e50;">Admin Dashboard</h1>
            <p style="text-align: center; margin-bottom: 20px;">All messages received from the portfolio coontact form.</p>

            <table class=""admin-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Message</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for msg in messages %}
                    <tr>
                        <td>{{ msg.id }}</td>
                        <td><strong>{{ msg.name}}</strong></td>
                        <td><a href="mailto:{{ msg.email }}">{{ msg.email }}</a></td>
                        <td>{{ msg.message }}</td>
                        <td>
                            <a href="/delete/{{msg.id}}"
                            onclick="return confirm('Are you sure you want to delete this message?')"
                            style="background-color: #ff4d4d; color: white; padding: 5px 10px; text-decoration: none; border-radius: 4px; font-size: 14px;">delete
                        </a>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="4" style="text-align: center;">No messages yet!</td>
                    </tr>
                    {% endfor %}
                </tbody> 
            </table>
            <div style="text-align: center; margin-top: 30px;">
                <a href="/" class="btn">Back to Portfolio</a>
            </div>
        </div>
        
    </body>
</html>
