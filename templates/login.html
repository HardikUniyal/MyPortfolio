<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Admin Access</title>
        <style>
            body{ font-family: Arial, Helvetica, sans-serif; text-align: center; margin-top: 100px; background-color: #f4f4f9;}
            .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block;}
            input {padding: 10px; margin: 10px 0; width: 80%; border: 1px solid #ccc; border-radius: 4px;}
            button {padding: 10px 20px; background-color: #28a745; color: white;  border-radius: 4px; cursor: pointer;}
            button:hover { background-color: #218838}
        </style>
    </head>
    <body>
        <div class="login-box">
            <h2> Restricted Area</h2>
            <form method="POST">
                <input type="password" name="password" placeholder="Enter Admin password" required>
                <br>
                <button type="submit">Verify Access</button>
            </form>
        </div>
    </body>
</html>
